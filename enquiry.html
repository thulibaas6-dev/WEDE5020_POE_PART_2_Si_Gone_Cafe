  <main>
<h2>Make an Enquiry</h2>
      <form id="enquiryForm" action="#" method="POST">
    <label for="enquiryName">Full Name:</label>
  <input type="text" id="enquiryName" required>
      <label for="enquiryEmail">Email Address:</label>
      <input type="email" id="enquiryEmail" required>

   <label for="enquiryService">Select Item / Service:</label>
  <select id="enquiryService">
 <option value="Coffee Catering">Coffee Catering (R50 per person)</option>
 <option value="Pastry Platter">Pastry Platter (R250 per platter)</option>
        <option value="Venue Booking">Private Venue Booking (R1500 flat fee)</option>
      </select><label for="enquiryQuantity">Quantity / Guests:</label>
      <input type="number" id="enquiryQuantity" min="1" value="1" required>

      <button type="submit">Calculate & Submit Enquiry</button>
      <div id="enquiryFeedback" style="margin-top: 10px; font-weight: bold;"></div>
    </form>
  </main>
